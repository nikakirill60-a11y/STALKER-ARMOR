name: Attach release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          gh release upload v1.0.0 dist/stalkerarmor-1.20.1.jar --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v1.0.0 --json assets --jq '.assets[].name'
