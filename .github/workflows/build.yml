name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log (on failure)
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p debug
          tail -c 3000000 build.log > debug/build.log
          git add debug
          if git diff --cached --quiet; then
            echo "no log changes"
          else
            git commit -m "CI: build failure log [skip ci]"
            git push
          fi
          exit 1

      - name: List outputs
        if: success()
        run: |
          ls -la build/libs || true
          ls -la build/reobfJar || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stalkerarmor-jar
          path: |
            build/libs/*.jar
            build/reobfJar/output.jar
          if-no-files-found: error

      - name: Commit built jar back to the branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          JAR=""
          if [ -f build/reobfJar/output.jar ]; then
            JAR=build/reobfJar/output.jar
          else
            JAR=$(ls build/libs/*.jar | grep -v -- -sources | head -1)
          fi
          echo "Publishing $JAR"
          cp "$JAR" "dist/stalkerarmor-1.20.1.jar"
          git add dist
          if git diff --cached --quiet; then
            echo "No jar changes to commit"
          else
            git commit -m "CI: built mod jar [skip ci]"
            git push
          fi

      - name: Attach jar to release (best effort)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.3 >/dev/null 2>&1 || gh release create v1.1.3 --title "STALKER Armor 1.1.3 — Minecraft 1.20.1 (Forge)" --target "$GITHUB_SHA" --notes "CRASH FIX: NullPointerException when loading boot models (missing "boot" part transform) + crash-proof armor loading."
          gh release upload v1.1.3 dist/stalkerarmor-1.20.1.jar --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v1.1.3 --json assets --jq '.assets[].name'
